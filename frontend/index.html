<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Day 300 E-Commerce</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px}
    button{padding:10px 14px;margin:4px;cursor:pointer}
    input{padding:10px;margin:4px}
    pre{background:#f4f4f4;padding:15px;border-radius:8px}
  </style>
</head>
<body>
  <h1>Day 300 E-Commerce Platform</h1>
  <p>Microservices + Redis + Kafka + MySQL + NGINX</p>
  <button onclick="loadProducts()">Load Products</button>
  <button onclick="health()">Gateway Health</button>
  <pre id="output">Ready.</pre>
  <script>
    async function loadProducts(){
      const r=await fetch('/api/products/');
      document.getElementById('output').textContent=JSON.stringify(await r.json(),null,2);
    }
    async function health(){
      const r=await fetch('/health');
      document.getElementById('output').textContent=await r.text();
    }
  </script>
</body>
</html>
