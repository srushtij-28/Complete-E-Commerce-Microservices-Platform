services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: mysql+pymysql://ecommerce:ecommerce@mysql:3306/ecommerce
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on:
      - mysql

  product-service:
    build: ./services/product-service
    environment:
      DATABASE_URL: mysql+pymysql://ecommerce:ecommerce@mysql:3306/ecommerce
    depends_on:
      - mysql

  cart-service:
    build: ./services/cart-service
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  order-service:
    build: ./services/order-service
    environment:
      DATABASE_URL: mysql+pymysql://ecommerce:ecommerce@mysql:3306/ecommerce
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mysql
      - kafka

  payment-service:
    build: ./services/payment-service
    environment:
      DATABASE_URL: mysql+pymysql://ecommerce:ecommerce@mysql:3306/ecommerce
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mysql
      - kafka

  inventory-service:
    build: ./services/inventory-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka

  shipping-service:
    build: ./services/shipping-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka

  audit-service:
    build: ./services/audit-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka

  notification-service:
    build: ./services/notification-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka

volumes:
  mysql_data:
